services:
  adminer:
    profiles: ["admin"]

  test-runner:
    build:
      context: .
      dockerfile: ops/tests/test-runner.Dockerfile
    environment:
      GATEWAY_URL: http://gateway:8080
      AUTH_URL: http://auth-service:8001
    depends_on:
      gateway:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    networks:
      - securecloud-net
    profiles: ["ci"]
