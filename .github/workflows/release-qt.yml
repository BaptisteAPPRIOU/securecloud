name: release-qt-client

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-qt-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  QT_APP_DIR: client/qt-app
  BUILD_TYPE: Release

jobs:
  build:
    name: Build Qt Client (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v5

      - name: Setup MSYS2 (UCRT64 + Qt)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-tools
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-zlib

      - name: Configure (Windows/MSYS2)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          cmake -S "${QT_APP_DIR}" -B build-qt -G Ninja \
            -DCMAKE_BUILD_TYPE=${BUILD_TYPE} \
            -DCMAKE_PREFIX_PATH=/ucrt64 \
            -DBUILD_TESTS=OFF

      - name: Build (Windows/MSYS2)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          cmake --build build-qt --parallel

      - name: Package (Windows windeployqt)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          APP_DIR="dist/windows/securecloud-qt-app-${TAG}-windows"
          mkdir -p "${APP_DIR}"

          EXE_PATH="$(find build-qt -type f -name 'MSF_Login.exe' | head -n 1)"
          if [ -z "${EXE_PATH}" ]; then
            echo "MSF_Login.exe not found in build-qt."
            exit 1
          fi

          cp "${EXE_PATH}" "${APP_DIR}/"
          /ucrt64/bin/windeployqt.exe --release --compiler-runtime --no-translations "${APP_DIR}/MSF_Login.exe"

      - name: Install NSIS (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nsis -y

      - name: Package installer (Windows NSIS)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $outDir = "dist/windows"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          $sourceDir = Resolve-Path "$outDir/securecloud-qt-app-$tag-windows"
          $outFile = Resolve-Path $outDir
          $outFile = Join-Path $outFile.Path "securecloud-qt-app-$tag-windows-setup.exe"
          $nsis = (Get-Command makensis.exe -ErrorAction SilentlyContinue).Source
          if (-not $nsis) {
            $nsis = "C:\\Program Files (x86)\\NSIS\\makensis.exe"
          }
          if (-not (Test-Path $nsis)) {
            throw "makensis.exe not found"
          }
          & $nsis /DVERSION=$tag /DSOURCE_DIR="$($sourceDir.Path)" /DOUTFILE="$outFile" "ops/installer/qt-client.nsi"

      - name: Zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $zipPath = "dist/windows/securecloud-qt-app-$tag-windows.zip"
          if (Test-Path $zipPath) { Remove-Item $zipPath }
          Compress-Archive -Path "dist/windows/securecloud-qt-app-$tag-windows/*" -DestinationPath $zipPath

      - name: Install Qt (macOS)
        if: runner.os == 'macOS'
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.1"
          cache: true

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install ninja

      - name: Configure (macOS)
        if: runner.os == 'macOS'
        run: |
          cmake -S "${QT_APP_DIR}" -B build-qt -G Ninja \
            -DCMAKE_BUILD_TYPE=${BUILD_TYPE} \
            -DBUILD_TESTS=OFF

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          cmake --build build-qt --parallel

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          APP_PATH="$(find build-qt -maxdepth 6 -type d -name 'MSF_Login.app' | head -n 1)"
          if [ -z "${APP_PATH}" ]; then
            echo "MSF_Login.app not found in build-qt."
            exit 1
          fi

          OUT_DIR="dist/macos/securecloud-qt-app-${TAG}-macos"
          mkdir -p "${OUT_DIR}"
          cp -R "${APP_PATH}" "${OUT_DIR}/"

          if command -v macdeployqt >/dev/null 2>&1; then
            macdeployqt "${OUT_DIR}/MSF_Login.app" -verbose=1
          else
            echo "macdeployqt not found; packaging raw .app."
          fi

          ZIP_NAME="securecloud-qt-app-${TAG}-macos.zip"
          (cd dist/macos && ditto -c -k --sequesterRsrc --keepParent "securecloud-qt-app-${TAG}-macos" "${ZIP_NAME}")

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qt-client-${{ runner.os }}
          path: |
            dist/**/*.zip
            dist/**/*.exe

  release:
    name: Create GitHub Release + attach assets
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v5

      - name: Download artifacts (Windows)
        uses: actions/download-artifact@v4
        with:
          name: qt-client-Windows
          path: artifacts/windows

      - name: Download artifacts (macOS)
        uses: actions/download-artifact@v4
        with:
          name: qt-client-macOS
          path: artifacts/macos

      - name: Create GitHub Release + upload assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/windows/**/*.zip
            artifacts/windows/**/*.exe
            artifacts/macos/**/*.zip
