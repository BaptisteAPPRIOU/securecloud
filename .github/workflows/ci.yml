name: ci

on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  COMPOSE_CI_ARGS: --project-directory . --env-file config/env/staging/.env.example -f ops/compose/compose.core.yml -f ops/compose/compose.ci.yml

jobs:
  build-unit:
    name: build + unit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v5

      - name: Install deps (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            g++ \
            pkg-config \
            libboost-all-dev \
            libssl-dev \
            nlohmann-json3-dev \
            libfmt-dev \
            libspdlog-dev \
            libpq-dev \
            libpqxx-dev

      - name: Configure/Build/Test (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DBUILD_QT_CLIENT=OFF
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure --no-tests=error

      - name: Setup MSYS2 (UCRT64 + deps)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-boost
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-nlohmann-json
            mingw-w64-ucrt-x86_64-spdlog
            mingw-w64-ucrt-x86_64-fmt
            mingw-w64-ucrt-x86_64-postgresql
            mingw-w64-ucrt-x86_64-gtest
            mingw-w64-ucrt-x86_64-libpqxx

      - name: Configure/Build/Test (MSYS2)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DBUILD_QT_CLIENT=OFF
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure --no-tests=error

  integration-compose:
    name: integration (compose + test-runner)
    runs-on: ubuntu-latest
    needs: [build-unit]
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v5

      - name: Compose up (detached)
        run: |
          docker compose $COMPOSE_CI_ARGS up -d --build

      - name: Run test-runner
        run: |
          docker compose $COMPOSE_CI_ARGS --profile ci run --rm test-runner

      - name: Dump logs on failure
        if: failure()
        run: |
          docker compose $COMPOSE_CI_ARGS logs --no-color

      - name: Compose down
        if: always()
        run: |
          docker compose $COMPOSE_CI_ARGS down -v --remove-orphans
