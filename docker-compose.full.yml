# SecureCloud Docker Compose - Full/Experimental Overlay
# Usage:
#   docker compose -f docker-compose.core.yml -f docker-compose.full.yml --profile full up -d
#
# NOTE:
#   Services in this file are planned/experimental until they have real binaries.

x-common-env: &common-env
  DB_HOST: postgres
  DB_PORT: 5432
  DB_NAME: ${DB_NAME:-securecloud}
  DB_USER: ${DB_USER:-scuser}
  DB_PASSWORD: ${DB_PASS:-scpassword}
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_PASSWORD: ${REDIS_PASSWORD:-redispass}
  JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
  JWT_ISSUER: ${JWT_ISSUER:-securecloud-auth}
  JWT_AUDIENCE: ${JWT_AUDIENCE:-securecloud-client}
  LOG_LEVEL: ${LOG_LEVEL:-info}

x-service-healthcheck: &service-healthcheck
  interval: 10s
  timeout: 5s
  retries: 5
  start_period: 30s

services:
  flyway-audit:
    image: flyway/flyway:10
    container_name: sc_flyway_audit
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./db/migrations/audit:/flyway/sql:ro
    command: >
      -url=jdbc:postgresql://postgres:5432/${DB_NAME:-securecloud}
      -user=${DB_USER:-scuser}
      -password=${DB_PASS:-scpassword}
      -schemas=audit
      -connectRetries=60
      migrate
    networks:
      - securecloud-net
    profiles:
      - full

  flyway-files:
    image: flyway/flyway:10
    container_name: sc_flyway_files
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./db/migrations/files:/flyway/sql:ro
    command: >
      -url=jdbc:postgresql://postgres:5432/${DB_NAME:-securecloud}
      -user=${DB_USER:-scuser}
      -password=${DB_PASS:-scpassword}
      -schemas=files
      -connectRetries=60
      migrate
    networks:
      - securecloud-net
    profiles:
      - full

  flyway-messaging:
    image: flyway/flyway:10
    container_name: sc_flyway_messaging
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./db/migrations/messaging:/flyway/sql:ro
    command: >
      -url=jdbc:postgresql://postgres:5432/${DB_NAME:-securecloud}
      -user=${DB_USER:-scuser}
      -password=${DB_PASS:-scpassword}
      -schemas=messaging
      -connectRetries=60
      migrate
    networks:
      - securecloud-net
    profiles:
      - full

  audit-service:
    build:
      context: .
      dockerfile: ops/docker/audit-service.Dockerfile
    container_name: sc_audit_service
    environment:
      <<: *common-env
      SERVICE_PORT: 8002
    ports:
      - "${AUDIT_PORT:-8002}:8002"
    depends_on:
      postgres:
        condition: service_healthy
      flyway-audit:
        condition: service_completed_successfully
    volumes:
      - sc_logs:/app/logs
    networks:
      - securecloud-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      <<: *service-healthcheck
    restart: unless-stopped
    profiles:
      - full

  files-service:
    build:
      context: .
      dockerfile: ops/docker/files-service.Dockerfile
    container_name: sc_files_service
    environment:
      <<: *common-env
      SERVICE_PORT: 8003
      STORAGE_PATH: /data/files
      MAX_FILE_SIZE_MB: 100
    ports:
      - "${FILES_PORT:-8003}:8003"
    depends_on:
      postgres:
        condition: service_healthy
      flyway-files:
        condition: service_completed_successfully
    volumes:
      - sc_files:/data/files
      - sc_logs:/app/logs
    networks:
      - securecloud-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      <<: *service-healthcheck
    restart: unless-stopped
    profiles:
      - full

  messaging-service:
    build:
      context: .
      dockerfile: ops/docker/messaging-service.Dockerfile
    container_name: sc_messaging_service
    environment:
      <<: *common-env
      SERVICE_PORT: 8004
      WEBSOCKET_PORT: 8005
    ports:
      - "${MESSAGING_PORT:-8004}:8004"
      - "${WEBSOCKET_PORT:-8005}:8005"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      flyway-messaging:
        condition: service_completed_successfully
    volumes:
      - sc_logs:/app/logs
    networks:
      - securecloud-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/health"]
      <<: *service-healthcheck
    restart: unless-stopped
    profiles:
      - full

  deploy-service:
    build:
      context: .
      dockerfile: ops/docker/deploy-service.Dockerfile
    container_name: sc_deploy_service
    environment:
      <<: *common-env
      SERVICE_PORT: 8006
    ports:
      - "${DEPLOY_PORT:-8006}:8006"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - sc_logs:/app/logs
    networks:
      - securecloud-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8006/health"]
      <<: *service-healthcheck
    restart: unless-stopped
    privileged: true
    profiles:
      - full

  gateway:
    depends_on:
      auth-service:
        condition: service_healthy
      audit-service:
        condition: service_healthy
      files-service:
        condition: service_healthy
      messaging-service:
        condition: service_healthy
