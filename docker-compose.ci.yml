services:
  audit-service:
    profiles: ["stub"]

  files-service:
    profiles: ["stub"]

  messaging-service:
    profiles: ["stub"]

  deploy-service:
    profiles: ["ops"]

  adminer:
    profiles: ["admin"]

  gateway:
    depends_on:
      auth-service:
        condition: service_healthy

  test-runner:
    build:
      context: .
      dockerfile: ops/tests/test-runner.Dockerfile
    environment:
      GATEWAY_URL: http://gateway:8080
      AUTH_URL: http://auth-service:8001
    depends_on:
      gateway:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    networks:
      - securecloud-net
    profiles: ["ci"]
